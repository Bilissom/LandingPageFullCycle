<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 190" role="img" aria-labelledby="title desc">
  <title id="title">FullCycle Development</title>
  <desc id="desc">Logotipo FullCycle com símbolo de infinito em gradiente azul, ciano e roxo, e o nome Development.</desc>
  <defs>
    <linearGradient id="fc-infinity" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D7F2"/>
      <stop offset="48%" stop-color="#087CFA"/>
      <stop offset="100%" stop-color="#B948F5"/>
    </linearGradient>
    <linearGradient id="fc-wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00CBEA"/>
      <stop offset="54%" stop-color="#3974FF"/>
      <stop offset="100%" stop-color="#B649F4"/>
    </linearGradient>
  </defs>

  <g transform="translate(8 7)">
    <path d="M24 82
             C24 40 69 25 104 63
             C133 95 149 124 183 111
             C222 96 217 43 184 33
             C151 23 131 55 106 82
             C79 111 61 132 38 119
             C20 109 17 94 24 82"
          fill="none" stroke="url(#fc-infinity)" stroke-width="22"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M102 63 C117 80 128 98 146 108" fill="none"
          stroke="#126EFA" stroke-width="22" stroke-linecap="round"/>

    <rect x="0" y="112" width="16" height="16" fill="#00D7F2"/>
    <rect x="17" y="132" width="19" height="19" fill="#08BDF2"/>
    <rect x="40" y="151" width="22" height="22" fill="#08A9F1"/>

    <rect x="177" y="0" width="15" height="15" fill="#B948F5"/>
    <rect x="153" y="20" width="22" height="22" fill="#A646F4"/>
    <rect x="195" y="26" width="16" height="16" fill="#B948F5"/>
    <rect x="178" y="48" width="14" height="14" fill="#914CF5"/>
  </g>

  <text x="252" y="105" font-family="Inter, Montserrat, Arial, sans-serif"
        font-size="83" font-weight="700" letter-spacing="-3">
    <tspan fill="#FFFFFF">Full</tspan><tspan fill="url(#fc-wordmark)">Cycle</tspan>
  </text>
  <text x="258" y="154" font-family="Inter, Montserrat, Arial, sans-serif"
        font-size="30" font-weight="400" letter-spacing="7" fill="#DDE7F4">DEVELOPMENT</text>
</svg>
